[project]
name = "noor-foods-api"
version = "0.1.0"
description = "An API for Noor Foods products, orders and stock"
readme = "README.md"
authors = [
    { name = "Yasir Ali Khan", email = "attaleghyasiralikhan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.163.2",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "sqlmodel>=0.0.50",
]


[tool.fastapi]
entrypoint = "noor_foods_api.main:app"


[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
